 if(L.wait>3)tips.push('Nhiều khách bỏ đi vì chờ lâu: thuê barista, nâng cấp máy pha hoặc dùng Auto-pha lúc đông.');if(L.stock>0)tips.push('Có khách bỏ đi vì hết hàng: nhớ nhập đủ nguyên liệu.');if(L.price>3)tips.push('Nhiều khách chê đắt: xem lại giá bán.');if(R.waste>50000)tips.push('Hao hụt do hết hạn khá nhiều: đừng tích trữ đồ tươi.');if(R.net<0)tips.push('Hôm nay lỗ: tăng giá/giảm hao hụt trước khi cạn vốn!');
 const body=`${bk?'<h3 class="bad2">💸 Nợ xấu đã hết ân hạn! Quán sắp bị thu hồi…</h3>':G.grace>0?`<h3 class="bad2">📕 Nợ xấu: còn ${G.grace} ngày ân hạn</h3>`:''}<table><tr><td>Doanh thu (+tip)</td><td><b>${vnd(R.rev+R.tip)}</b></td></tr><tr><td>Ly bán / khách giận</td><td>${R.cups} / ${R.angry}</td></tr><tr><td>Giá vốn dùng</td><td>−${vnd(R.cogs)}</td></tr><tr><td>Hao hụt hết hạn</td><td>−${vnd(R.waste)}</td></tr><tr><td>Lương + điện nước</td><td>−${vnd(R.wages+R.util)}</td></tr>${R.rent?`<tr><td>Tiền thuê tuần</td><td>−${vnd(R.rent)}</td></tr>`:''}${R.tax?`<tr><td>Thuế</td><td>−${vnd(R.tax)}</td></tr>`:''}<tr><td>Quảng cáo / viện phí</td><td>−${vnd(R.ads+R.faint)}</td></tr>
 <tr><td><b>Lợi nhuận ròng</b></td><td><b class="${R.net>=0?'ok':'bad2'}">${vnd(R.net)}</b>${R.rev+R.tip>0?' ('+Math.round(R.net/(R.rev+R.tip)*100)+'%)':''}</td></tr><tr><td>Tiền mặt hiện có</td><td><b class="${G.money<0?'bad2':''}">${vnd(G.money)}</b></td></tr></table>
 <p><b>Doanh thu theo giờ</b></p><div class="bars">${R.hr.slice(6).map(v=>`<i style="height:${v/mx*100}%" title="${vnd(v)}"></i>`).join('')}</div><div class="note">06h → 23h</div>
 <p>🏆 Top món: ${top.length?top.map(x=>esc(x[0])+' ×'+x[1]).join(' • '):'—'}<br>Khách bỏ đi: chờ lâu ${L.wait} • đắt ${L.price} • hết hàng ${L.stock} • quá đông ${L.crowd}</p>
 ${R.best?`<p class="note">💬 Tốt nhất: ${esc(R.best.n)} ${stars(R.best.s)} – ${esc(R.best.t)}</p>`:''}${R.worst&&R.worst!==R.best?`<p class="note">💬 Tệ nhất: ${esc(R.worst.n)} ${stars(R.worst.s)} – ${esc(R.worst.t)}</p>`:''}
 ${tips.map(t=>'<p class="note">💡 '+t+'</p>').join('')}${R.note.map(t=>'<p class="note">'+t+'</p>').join('')}<p class="note">😴 Đi ngủ lúc ${hhmm(R.bt)}: hồi ${R.rec}% thể lực${R.nw?' + Ngủ ngon!':''}.</p>`;
 return box('📊 Tổng kết ngày '+R.day+' – '+WD[R.wd],body,(G.money<0||G.grace>0?'<button class="bad" data-a="rescue">🆘 Cứu nguy</button>':'')+(bk?'<button class="pk" data-a="bkgo">📰 Tiếp tục…</button>':'<button class="pk" data-a="newday">☀️ Sang ngày mới</button>'),1)})}
A.newday=()=>newDay();
A.bkgo=()=>{AU.sfx('crash');openM('bkcut',()=>box('📰 Nyan Town Daily',`<div class="news"><h1>MEOW TEA ĐÓNG CỬA!</h1><p><i>Rèm cửa sập xuống lúc 22:00. Chủ quán Mochi không trả nổi nợ.</i></p><p>Ngân hàng thu hồi máy móc, nhân viên nghỉ việc, quán trở về chiếc ki-ốt nhỏ ban đầu.</p><p><b>Nhưng công thức, bạn bè và tay nghề vẫn còn nguyên.</b></p></div>`,'<button class="pk" data-a="bkdone">Làm lại – Từ tro tàn 🔥</button>',1))};
A.bkdone=()=>{applyBankruptcy();newDay();dialog('👵 Bà Mimi',['Đừng buồn, cháu à. Ai làm quán mà chẳng có lúc ngã.','Bà giữ lại cuốn sổ công thức cho cháu rồi. 7 ngày tới cả phố sẽ thương cháu hơn (+10% khách), nhiệm vụ cũng thưởng gấp đôi.','Dựng lại nhé, cháu sẽ được huy hiệu "Từ tro tàn"! (Lần phá sản thứ '+G.bk+' – kể cũng có chuyện để kể 😸)'])};

/* ---- Cài đặt, tiêu đề ---- */
function slotInfo(n){try{const o=JSON.parse(localStorage.getItem('mtt_s'+n));return o?`Ngày ${o.G.day} • ${vnd(o.G.money)}`:'(trống)'}catch(e){return'(trống)'}}
function openSet(){openM('set',()=>box('⚙️ Cài đặt',`${[['mv','🔊 Tổng'],['mm','🎵 Nhạc'],['ms','🔔 Hiệu ứng'],['ma','🌧️ Môi trường']].map(([k,l])=>`<div class="row"><label>${l}</label><input type="range" min="0" max="1" step=".05" value="${AU[k]}" data-i="vol" data-v="${k}"></div>`).join('')}
<div class="row"><label><input type="checkbox" data-i="cap" ${AU.cap?'checked':''}> Phụ đề âm thanh</label><label><input type="checkbox" data-i="rm" ${REDUCE?'checked':''}> Giảm chuyển động</label></div>
<div class="row"><label>Giờ bán</label><select data-i="oh">${[6,7,8,9,10,11,12].map(h=>`<option ${h===G.oh?'selected':''}>${h}</option>`).join('')}</select> → <select data-i="ch">${[17,18,19,20,21,22,23].map(h=>`<option ${h===G.ch?'selected':''}>${h}</option>`).join('')}</select></div><p class="note">💾 Game tự lưu liên tục; mở lại sẽ chơi tiếp đúng chỗ đang dở.</p>
${[1,2,3].map(n=>`<div class="row"><label>Ô lưu ${n}</label><span class="note" style="min-width:140px">${slotInfo(n)}</span><button data-a="sv" data-v="${n}">Lưu</button><button data-a="ld" data-v="${n}">Tải</button></div>`).join('')}
<div class="row"><button data-a="export">📤 Xuất file save</button><button data-a="tuton">❓ Bật lại hướng dẫn</button></div><textarea id="expt" rows="2" style="width:100%" placeholder="Dán nội dung file save để nhập…"></textarea><div class="row"><button data-a="import">📥 Nhập save</button><button class="bad" data-a="reset">🗑 Xóa & chơi lại</button></div>`))}
function openTitle(){let has=false;try{has=!!localStorage.getItem('mtt_auto')}catch(e){}openM('title',()=>`<div class="card" style="text-align:center"><div class="hd"><h2>🐈 Meow Tea Tycoon</h2></div><div class="bd"><p>Mochi thừa kế ki-ốt trà sữa của bà ngoại ở <b>Nyan Town</b>. Pha trà, kết bạn, trang trí quán… và nhớ giữ cho quán <b>đừng lỗ hết vốn</b> kẻo phá sản nhé!</p><div class="grid"><button data-a="newg" class="pk" data-primary="1">🌸 Bắt đầu</button>${has?'<button data-a="cont" class="mt">▶ Tiếp tục</button>':''}${[1,2,3].filter(n=>slotInfo(n)!=='(trống)').map(n=>`<button data-a="ld" data-v="${n}">📂 Ô ${n}: ${slotInfo(n)}</button>`).join('')}</div><p class="note">WASD/mũi tên đi • Shift chạy • E/Space tương tác • Tab kho • Q sổ • M menu • Esc đóng. Điện thoại: cần điều khiển + nút E, hoặc chạm vào đồ vật.</p></div></div>`)}
A.cont=()=>{AU.init();if(load('auto')){closeM();if(G.pendSum&&G.lastR)openSummary(G.lastR)}};
A.newg=()=>{AU.init();useG(defaultG());closeM();save('auto');rollQuest();dialog('👵 Bà Mimi',['Chào cháu Mochi! Từ hôm nay ki-ốt trà sữa này là của cháu rồi.','Cuốn Sổ Công Thức của bà ngoại còn nhiều trang trống lắm, cháu cứ thoải mái sáng chế nhé.','3 ngày đầu là ngày tập sự, không bị phạt gì cả. Cứ làm theo gợi ý ở thanh vàng phía trên!'])};
A.restart=()=>{try{localStorage.removeItem('mtt_auto')}catch(e){}closeM();useG(defaultG());openTitle()};

/* ---- Hướng dẫn, HUD, bảng bên ---- */
const TUT=[{t:'Ăn sáng ở Bếp ăn (lại gần, bấm E hoặc chạm vào).',mk:'food',ok:()=>G.fl.ate},{t:'Ra Cửa phía dưới để đi chợ.',mk:'door',ok:()=>G.fl.market},{t:'Mua ít nhất 5 loại nguyên liệu (Meowmart có ngay).',mk:'door',ok:()=>G.fl.bought>=5},
 {t:'Nấu trân châu ở Nồi trước giờ mở cửa (09:00).',mk:'pot',ok:()=>G.fl.cooked},{t:'Khi có khách: đến Quầy pha chế, bấm E rồi "Pha" (mini-game 3 bước) hoặc ⚡ Auto.',mk:'brew',ok:()=>G.fl.cups>=1},{t:'Để mắt thanh kiên nhẫn của khách. Bàn dơ: chạm vào hoặc bấm E để lau.',ok:()=>G.fl.cups>=3},
 {t:'Mệt/đói? Ăn ở Bếp ăn, ngủ trưa ở Giường. Sau 21:00 hãy đi ngủ.',mk:'bed',ok:()=>G.day>=2},{t:'Ngày 2: mở Sổ công thức và tự sáng chế món đầu tiên!',mk:'lab',d:2,ok:()=>G.fl.created},{t:'Ngày 3: thử quảng cáo hoặc nâng cấp ở Máy tính.',mk:'pos',d:3,ok:()=>G.fl.posUsed},{t:'Ngày 8+: đủ 2⭐ và quỹ lương → tuyển nhân viên đầu tiên.',mk:'pos',d:8,ok:()=>G.staff.length>0}];
function setH(el,h){if(el._h!==h){el._h=h;el.innerHTML=h}}
function tutTick(){const el=document.getElementById('tutbar');if(G.tut.off||G.tut.i>=TUT.length){el.style.display='none';resize();return}const s=TUT[G.tut.i];if(s.ok()){G.tut.i++;toast('✅ Xong bước hướng dẫn!','good');AU.sfx('quest');return}
 const was=el.style.display;el.style.display='block';setH(el,G.day<(s.d||1)?'🐾 Hôm nay bạn tự do khám phá! <button data-a="tutskip">Ẩn</button>':`🐾 <b>${G.tut.i+1}/${TUT.length}</b> ${s.t} <button data-a="tutskip">Bỏ qua</button>`);if(was!=='block')resize()}
A.tutskip=()=>{G.tut.off=1;tutTick()};A.tuton=()=>{G.tut.off=0;G.tut.i=0;closeM()};
const E=id=>document.getElementById(id);let shown=0,sideAt=0;
function hud(){if(!G)return;shown+=(G.money-shown)*.15;if(Math.abs(G.money-shown)<1)shown=G.money;const f=fat(),low=G.money<3*fixedCost()&&!tut();
 setH(E('hMoney'),`💰 <b class="${low?'warn':''}" style="color:${low?'':shown<G.money-1?'#2e8b57':shown>G.money+1?'#e8505b':'inherit'}">${vnd(shown)}</b>${G.grace>0?' <b class="warn">📕'+G.grace+'</b>':''}`);setH(E('hTime'),`🕒 <b>${hhmm(G.min)}</b> <small>${phase()}</small>`);
 setH(E('hDate'),`📅 <b>${WD[wd()]}</b> <small>${dos()}/${SN[sea()]} • N${G.day}</small>${fest()?' 🎊':''}`);setH(E('hWx'),`${WX[G.weather][0]} <b>${tempC()}°C</b> ${isOpen()?'<b class="ok">MỞ</b>':'<b class="bad2">ĐÓNG</b>'}${G.sick>0?' 🤧':''}`);
 setH(E('hRep'),`⭐ <b>${G.rep.toFixed(1)}</b> <small>📱${G.fol}</small>`);setH(E('hLv'),`🧋 Lv<b>${G.lv}</b> <div class="pbar"><i style="width:${G.lv>=10?100:G.xp/need(G.lv)*100}%"></i></div>`);
 [['bSt',G.stamina],['bHu',G.hunger],['bCl',G.hyg],['bMo',G.mood]].forEach(([id,v])=>{const e=E(id);e.style.width=clamp(v,0,100)+'%';e.style.background=v>50?'#4caf7a':v>25?'#f2b632':'#e8505b'});E('bSt').parentNode.parentNode.title='Thể lực – '+f.n;
 E('cancelB').style.display=P.act&&!M?'block':'none';E('pause').style.display=M&&M.id!=='title'&&M.id!=='sum'?'block':'none';
 if(T-sideAt>.6){sideAt=T;sidePanel()}}
function sidePanel(){const t=G.today,dl=wd()===6?0:6-wd(),pa=G.pearls.q>0?pearlsAvail():0,q=G.quest;
 if(t.cups>=40&&!t.goalDone){t.goalDone=1;G.money+=300000;toast('🎯 Đạt mục tiêu 40 ly! Thưởng 300.000đ','gold');confetti();AU.sfx('quest')}
 const lack=G.menu.map(id=>G.recipes.find(r=>r.id===id)).filter(r=>r&&!canMake(r).ok).map(r=>esc(r.name));
 setH(E('goals'),`${q?`<div class="gl">📜 <b>Nhiệm vụ:</b> ${esc(q.txt)}<div class="pbar"><i style="width:${Math.min(100,q.have/q.need*100)}%"></i></div><small>${q.done?'✅ Xong!':q.have+'/'+q.need+' • thưởng '+vnd(q.rw)}</small></div>`:''}<div class="gl">🥤 Hôm nay: <b>${t.cups}/40</b> ly <div class="pbar"><i style="width:${Math.min(100,t.cups*2.5)}%"></i></div></div><div class="gl">🏠 Tiền thuê ${vnd(CONFIG.rent)}: ${dl?'còn '+dl+' ngày':'<b class="bad2">HÔM NAY</b>'}</div><div class="gl">⚫ Trân châu: <b>${pa}</b> phần</div><div class="gl">👥 Hàng chờ: ${Q().length}/6 • ${fat().n}</div>${G.rise>0?`<div class="gl ok">🔥 Từ tro tàn: còn ${G.rise} ngày (+10% khách)</div>`:''}${G.bankDebt?`<div class="gl bad2">🏦 Nợ ngân hàng: ${vnd(G.bankDebt)}</div>`:''}${lack.length?`<div class="gl bad2">⚠ Thiếu NL cho: ${lack.join(', ')}</div>`:''}${G.debt?`<div class="gl">Nợ Mimi: ${vnd(G.debt)}</div>`:''}`);
 setH(E('revs'),G.revs.slice(0,6).map(r=>`<div class="rv"><b>${esc(r.n)}</b> ${stars(r.s)}<br>${esc(r.t)}</div>`).join('')||'<div class="note">Chưa có đánh giá.</div>');
 setH(E('ach'),ACH.map(a=>`<span class="badge ${G.ach[a[0]]?'':'off'}" title="${a[2]}: ${a[3]}">${a[1]}</span>`).join(''));checkAch()}

/* ================= 15. NHẬP LIỆU, VÒNG LẶP, TỰ LƯU ================= */
const KEYBLOCK=new Set(['title','sum','dlg','bkcut']);
function modalPrimary(){const q=['[data-primary]','.ft .pk','.ft button:not(.bad)','.bd .pk'];for(const s of q){const b=mbox.querySelector(s+':not([disabled])');if(b)return b}return null}
addEventListener('keydown',e=>{const k=e.key;AU.init();const tg=e.target&&e.target.tagName,typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
 if(M){
  if(k==='Escape'){if(!KEYBLOCK.has(M.id)){if(M.id==='mini'){A.mgcancel()}else closeM()}return}
  if(M.id==='mini'){if(k===' '||k==='Enter'){e.preventDefault();if(e.repeat)return;if(MG.step===1)A.mgact();else if(MG.step===2)mgHold(1)}return}
  if(typing)return;
  if(/^[1-9]$/.test(k)){const bs=[...mbox.querySelectorAll('.bd [data-a]:not([disabled])')];const b=bs[+k-1];if(b){b.click();e.preventDefault()}return}
  if((k===' '||k==='Enter')&&tg!=='BUTTON'){const b=modalPrimary();if(b){e.preventDefault();b.click()}}
  if(k==='ArrowRight'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowUp'){const bs=[...mbox.querySelectorAll('button:not([disabled]),input,select')],i=bs.indexOf(document.activeElement);const n=bs[(i+((k==='ArrowRight'||k==='ArrowDown')?1:-1)+bs.length)%bs.length];if(n){n.focus();e.preventDefault()}}
  return}
 if(k==='Escape'){if(P.act)A.cancelAct();return}
 if(!G)return;const kk=k.toLowerCase();KEYS[kk]=1;
 if(kk==='e'||k===' '||k==='Enter'){e.preventDefault();interact()}else if(k==='Tab'){e.preventDefault();openInv()}else if(kk==='q')openBook();else if(kk==='m')openMenu();else if(kk==='1'||kk==='2'||kk==='3'){G.speed=+kk;$('#bSpd').textContent='⏩ x'+kk}
 if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=0;if(M&&M.id==='mini'&&(e.key===' '||e.key==='Enter'))mgHold(0)});addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=0;JOY={x:0,y:0}});
document.addEventListener('pointerover',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.disabled&&e.pointerType==='mouse'&&T-AU.lastHover>.06){AU.lastHover=T;AU.sfx('hover')}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&navigator.vibrate)try{navigator.vibrate(8)}catch(x){}if(b&&b.classList.contains('pk'))AU.sfx('click2')},true);
cv.addEventListener('pointerdown',e=>{AU.init();tapWorld(e)});
(function(){const j=E('joy'),kn=E('knob');let id=null;const mv=e=>{const r=j.getBoundingClientRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2;let dx=(e.clientX-cx0)/(r.width/2),dy=(e.clientY-cy0)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}JOY={x:dx,y:dy};kn.style.left=(33+dx*33-23+23)+'px';kn.style.top=(33+dy*33-23+23)+'px'};
 const up=()=>{id=null;JOY={x:0,y:0};kn.style.left='30px';kn.style.top='30px'};let lastTap=0;
 j.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();id=e.pointerId;j.setPointerCapture(id);mv(e);const n=performance.now();if(n-lastTap<300){RUNT=!RUNT;E('tRun').classList.toggle('on',RUNT)}lastTap=n});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up);
 E('tE').addEventListener('pointerdown',e=>{e.preventDefault();AU.init();interact()});E('tRun').addEventListener('pointerdown',e=>{e.preventDefault();RUNT=!RUNT;E('tRun').classList.toggle('on',RUNT)})})();
function pickTrack(){if(!G)return'menu';if(M&&M.id==='title')return'menu';const h=hh(),pk=(h>=11.5&&h<13)||(h>=15&&h<18);if(fest()&&isOpen())return'fest';if(G.weather==='mua'||G.weather==='muato')return pk&&isOpen()?'peak':'rain';if(h<9)return'morning';if(pk&&isOpen())return'peak';if(h>=18)return'evening';return'sales'}
let last=0,secAt=0;
function loop(now){requestAnimationFrame(loop);const rdt=Math.min((now-last)/1000||0,.1);last=now;T+=rdt;
 if(G){if(!M){let r=rdt*G.speed;while(r>0){const s=Math.min(.05,r);update(s,false);r-=s;if(FQ){handleFQ();break}}}
  if(T-secAt>.5){secAt=T;if(!M)tutTick();AU.setTrack(pickTrack())}
  render();hud()}}
function autosave(){if(G&&!(M&&M.id==='title'))save('auto')}
setInterval(autosave,4000);addEventListener('pagehide',autosave);document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});
function boot(){AU.load();REDUCE=(()=>{try{return JSON.parse(localStorage.getItem('mtt_pref')).rm||0}catch(e){return 0}})();let has=false;try{has=!!localStorage.getItem('mtt_auto')}catch(e){}
 G=defaultG();buildTables();buildWorld();resize();setTimeout(resize,150);if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(document.getElementById('stage'));
 if(has&&load('auto')){if(G.pendSum&&G.lastR)openSummary(G.lastR);else toast('📂 Đã tiếp tục game đang chơi dở','good')}else openTitle();
 requestAnimationFrame(loop)}
window.MTT={get G(){return G},A,update,advanceMin,finishDay,newDay,spawnCust,CU:()=>CU,completeBrew,Q,canMake,addStock,total,P,openBrew,interact,near,resize,applyBankruptcy};
boot();
